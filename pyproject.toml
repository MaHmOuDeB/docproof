[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docproof"
version = "0.2.0"
description = "Fact-grounded documents with automated verification: a Python CLI plus Claude Code agents that build, tailor, verify and render .docx/PDF documents from one fact base."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[project.scripts]
docproof = "docproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docproof = ["assets/fonts/*", "prompts/*.md", "templates/*"]
